name: AI News Pipeline

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:
    inputs:
      max_shorts:
        description: "Number of news items"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAX_SHORTS: ${{ github.event.inputs.max_shorts || '3' }}
        working-directory: pipeline
        run: python main.py

      - name: Save seen
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/seen_links.json || true
          git diff --quiet --cached || git commit -m "update seen [skip ci]"
          git push || true
