name: AI News Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, tts, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ITEMS: "3"
        run: python pipeline/main.py

      - name: Commit updated seen_links.json
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add seen_links.json
          git diff --quiet --cached || git commit -m "update seen links [skip ci]"
          git pull --rebase origin main
          git push
