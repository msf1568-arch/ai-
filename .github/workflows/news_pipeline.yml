name: AI News Pipeline

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      max_shorts:
        description: 'Number of Shorts'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SHORTS: ${{ github.event.inputs.max_shorts || '3' }}
          MAKE_LONG_VIDEO: "false"
        working-directory: pipeline
        run: python main.py

      - name: Save seen links
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_links.json || true
          git diff --quiet --cached || git commit -m "update [skip ci]"
          git push || true
